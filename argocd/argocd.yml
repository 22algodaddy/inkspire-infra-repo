apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inkspire-react-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/22algodaddy/Inkspire.git'
    targetRevision: main
    path: helm/react-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: inkspire
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
